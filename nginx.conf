events {}

http {
    upstream react_frontend {
        server 127.0.0.1:5173;
    }

    upstream java_backend {
        server 127.0.0.1:8080;
    }

    upstream python_ocr {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # OCR image uploads go straight to FastAPI.
        # /api/ocr/extract becomes /ocr/extract on the Python service.
        location /api/ocr/ {
            proxy_pass http://python_ocr/ocr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Java owns auth, finance data, receipt persistence, and transaction creation.
        location /api/ {
            proxy_pass http://java_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite frontend.
        location / {
            proxy_pass http://react_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
